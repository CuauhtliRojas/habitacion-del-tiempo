experiment_name: local_inpainting_training_512_pw33_lr3e4_stable_e15_bs4_IoU
dataset_root: Dataset_U-Net_dual_decoder_fs_li
output_root: outputs/experiments

attacks:
  - local_inpainting

train_split: train
test_split: test
image_size: 512

# Intento principal para RTX 4050 6GB.
# Si hay CUDA out of memory, usar batch_size: 2 y gradient_accumulation_steps: 4.
batch_size: 4

# Effective batch size = 4 * 2 = 8.
gradient_accumulation_steps: 2

epochs: 15
learning_rate: 0.0003

# Calculado desde:
# local_inpainting/train/mascara_fake
# positive_fraction = 0.0290061315
# negative_fraction = 0.9709938685
# pos_weight = negative_pixels / positive_pixels
pos_weight: 33.4754694047

lambda_bce: 1.0
lambda_dice: 2.0
max_grad_norm: 1.0
lambda_iou: 1.0

val_ratio: 0.1
seed: 117
num_workers: 0
threshold: 0.5
checkpoint_every: 1
sample_every: 1
mixed_precision: true
